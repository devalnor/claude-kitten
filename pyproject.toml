[project]
name = "claude-kitten"
version = "0.2.10"
description = "Claude Code plugin — important phrases spoken aloud via KittenTTS"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "maxime.io" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "kittentts @ git+https://github.com/KittenML/KittenTTS.git@0.8.1",
    "soundfile",
    "numpy",
]

[project.urls]
Repository = "https://github.com/devalnor/claude-kitten"

[project.scripts]
claude-kitten = "claude_kitten.__main__:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["claude_kitten*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
